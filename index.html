<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Слайдер зображень</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <h1>Слайдер зображень</h1>
    <div class="slider-wrapper">
        <button class="nav-button prev"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"
                xmlns="http://www.w3.org/2000/svg">
                <path d="M6.375 3.75C6.375 3.75 11.625 6.858 11.625 9C11.625 11.1413 6.375 14.25 6.375 14.25"
                    stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg></button>
        <div class="slider">
            <img src="./img/1.JPG" class="active" alt="Slide 1">
            <img src="./img/2.JPG" alt="Slide 2">
            <img src="./img/3.JPG" alt="Slide 3">
            <img src="./img/4.JPG" alt="Slide 4">
            <img src="./img/5.JPG" alt="Slide 5">
            <img src="./img/6.JPG" alt="Slide 6">
            <img src="./img/7.JPG" alt="Slide 7">
            <img src="./img/8.JPG" alt="Slide 8">
            <img src="./img/9.JPG" alt="Slide 9">
            <div class="dots"></div>
        </div>
        <button class="nav-button next"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"
                xmlns="http://www.w3.org/2000/svg">
                <path d="M6.375 3.75C6.375 3.75 11.625 6.858 11.625 9C11.625 11.1413 6.375 14.25 6.375 14.25"
                    stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg></button>
    </div>
    <script src="./js/script.js"></script>
</body>

</html>
