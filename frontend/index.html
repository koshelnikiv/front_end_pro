<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDo List з модалкою</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Основний CSS -->
  <link rel="stylesheet" href="./css/main.css">
</head>

<body>
  <div class="container">
    <h1>ToDoList</h1>

    <!-- Форма додавання завдання -->
    <form class="form js--form">
      <input type="text" name="value" required class="form__input js--form__input" placeholder="Нове завдання">
      <button type="submit" class="form__btn">Додати</button>
    </form>

    <!-- Список завдань -->
    <ul class="js--todos-wrapper">
      <!-- Початкові завдання можуть бути додані тут вручну -->
      <li class="todo-item">
        <input type="checkbox">
        <span class="todo-item__description">Приклад завдання</span>
        <button class="todo-item__delete">Видалити</button>
      </li>
    </ul>
  </div>

  <!-- Bootstrap Modal -->
  <div class="modal fade" id="taskModal" tabindex="-1" aria-labelledby="taskModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <!-- Заголовок -->
        <div class="modal-header">
          <h5 class="modal-title" id="taskModalLabel">Ваше завдання</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрити"></button>
        </div>
        <!-- Текст завдання -->
        <div class="modal-body" id="modal-task-text"></div>
        <!-- Кнопка Закрити -->
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрити</button>
        </div>
      </div>
    </div>
  </div>

  <!-- jQuery -->
  <script src="./js/jquery.min.js"></script>
  <!-- Bootstrap Bundle JS (з модалками) -->
  <script src="./js/bootstrap.bundle.min.js"></script>
  <!-- Основний JS -->
  <script src="./js/main.js"></script>
</body>

</html>
